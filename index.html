<!DOCTYPE html>
<html lang="zh-TW">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        /* Muji/Minimalist Custom Styles */
        :root {
            --color-primary: #52734D; /* 柔和苔綠 */
            --color-bg: #F9F9F9; /* 米白色背景 */
            --color-card-bg: #FFFFFF; /* 卡片白色 */
            --color-accent: #B2D4C8; /* 淺綠色點綴 */
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--color-bg);
            padding-bottom: 4rem; /* 確保內容不會被底部導航遮擋 */
        }
        .muji-card {
            background-color: var(--color-card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.03);
            border: 1px solid rgba(0, 0, 0, 0.05);
        }
        .muji-btn {
            background-color: var(--color-primary);
            color: white;
            border-radius: 8px;
            transition: background-color 0.2s;
        }
        .muji-btn:hover {
            background-color: #6a9562;
        }
        /* 導航列樣式 */
        .nav-item.active {
            color: var(--color-primary);
            font-weight: 600;
        }
        /* 確保內容區塊佔滿視窗 */
        .page-content {
            padding-top: 2rem;
            padding-bottom: 2rem;
            min-height: calc(100vh - 4rem - 2rem); 
        }
        /* 時間軸線條 */
        .timeline-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 2px;
            background-color: var(--color-accent);
        }
        .timeline-dot {
            position: absolute;
            left: -8px;
            top: 4px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background-color: var(--color-primary);
            border: 3px solid var(--color-bg);
            z-index: 10;
        }
        .highlight-time {
            background-color: #ffedd5; /* 淺橙色/米黃色強調 */
            color: #c2410c; /* 深橘色文字 */
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 600;
            display: inline-block;
        }
        /* 隱藏原生檔案輸入，僅顯示按鈕 */
        .hidden-file-input {
            opacity: 0;
            position: absolute;
            z-index: -1;
            pointer-events: none;
        }
        /* Modal 樣式 */
        .modal {
            display: none; /* 預設隱藏 */
            position: fixed;
            z-index: 100;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.4);
            backdrop-filter: blur(3px);
            padding-top: 50px;
        }
        .modal-content {
            background-color: var(--color-card-bg);
            margin: 5% auto; /* 5% from the top and centered */
            padding: 20px;
            border-radius: 12px;
            width: 90%; /* Responsive width */
            max-width: 400px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
            animation: fadeIn 0.3s;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

         * @returns
         */
        function loadFromLS(key, defaultValue) {
            
            const lsKey = LS_PREFIX + key + '_' + userId;
            const data = localStorage.getItem(lsKey);
            
            // 核心修正 2: 處理 tripInfo 時，使用深拷貝確保結構完整
            let finalDefaultValue;
            if (key === 'tripInfo') {
                 // 使用 JSON 技巧進行深拷貝，避免修改到原始的 initialTripInfo
                 finalDefaultValue = JSON.parse(JSON.stringify(initialTripInfo));
            } else if (key === 'checklistItems') {
                 finalDefaultValue = JSON.parse(JSON.stringify(defaultValue));
            } else {
                 finalDefaultValue = defaultValue;
            }

            if (data === null) return finalDefaultValue;
            
            try {
                const parsedData = JSON.parse(data);
                
                // 針對 tripInfo 進行結構性檢查與補全 (向下相容)
                if (key === 'tripInfo') {
                    // 確保載入的數據包含所有必要的子結構，如果沒有則從預設值中補上
                    if (!parsedData.flight || !parsedData.days) {
                         console.warn(`[LS] Loaded tripInfo for ${userId} is incomplete, resetting core structure.`);
                         return finalDefaultValue;
                    }
                    if (!parsedData.editableTransportGuide) {
                        parsedData.editableTransportGuide = finalDefaultValue.transportGuide;
                    }
                    if (!parsedData.foodRecommendations) {
                        parsedData.foodRecommendations = finalDefaultValue.foodRecommendations;
                    }
                }
                
                return parsedData;

            } catch (e) {
                console.error(`[LS] Error parsing LS data for key: ${key}, resetting data.`, e);
                // 如果解析失敗，返回預設值並清除舊的壞資料
                localStorage.removeItem(lsKey);
                return finalDefaultValue;
            }
        }

        /**
         * Base64 轉 ArrayBuffer (用於圖片壓縮)
         */
        function base64ToArrayBuffer(base64) {
            const binary_string = window.atob(base64.split(',')[1] || base64);
            const len = binary_string.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) {
                bytes[i] = binary_string.charCodeAt(i);
            }
            return bytes.buffer;
        }

        /**
         * 圖片壓縮並轉 Base64
         */
        function compressImage(dataUrl) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 200; // 縮圖最大寬度
                    let width = img.width;
                    let height = img.height;

                    if (width > MAX_WIDTH) {
                        height = height * (MAX_WIDTH / width);
                        width = MAX_WIDTH;
                    }

                    canvas.width = width;
                    canvas.height = height;

                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    // 轉為 JPEG 格式，品質 0.7，減少字串長度
                    const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.7);
                    resolve(compressedDataUrl);
                };
                img.onerror = () => resolve(''); // 處理載入錯誤
                img.src = dataUrl;
            });
        }

                            dayIndex: dayIndex,

        window.changePageAndScroll = function(page, elementId) {

            setTimeout(() => {
                const targetElement = document.getElementById(elementId);
                if (targetElement) {
                    // 滾動到元素頂部，並加上一個小小的偏移量 (例如 -80px)
                    const yOffset = -80; 
                    const y = targetElement.getBoundingClientRect().top + window.pageYOfs-set + yOffset;
                    window.scrollTo({ top: y, behavior: 'smooth' });
                    
                    // 為了視覺上強調，可以短暫地給元素加上邊框
                    targetElement.classList.add('ring-2', 'ring-orange-500', 'ring-offset-2', 'transition-all');
                    setTimeout(() => {
                        targetElement.classList.remove('ring-2', 'ring-orange-500', 'ring-offset-2');
                    }, 1500);

                    // 確保導航列狀態正確
                    document.querySelectorAll('.nav-item').forEach(btn => {
                        btn.classList.remove('active');
                        if (btn.dataset.page === page) {
                            btn.classList.add('active');
                        }
                    });

                }
            }, 50);

        function calculateTWD(jpy) {
            return Math.round(jpy * exchangeRate);
        }

        function addBudgetEntry() {
            const item = document.getElementById('item-input').value.trim();
            const jpyExpression = document.getElementById('jpy-input').value.trim();
            const fileInput = document.getElementById('receipt-image');
            
            if (!item || !jpyExpression) {
                alert("請輸入項目名稱和日幣金額/算式！");
                return;
            }

            // 嘗試計算 JPY 金額
            let jpy = 0;
            try {
                // 使用 Function 構造函數來安全執行算式
                jpy = new Function('return ' + jpyExpression)();
                if (typeof jpy !== 'number' || isNaN(jpy)) {
                    throw new Error("Invalid calculation result");
                }
                jpy = Math.round(jpy);
            } catch (e) {
                alert("日幣算式無效，請檢查輸入！");
                return;
            }

            const twd = calculateTWD(jpy);

            const entry = {
                item: item,
                jpy: jpy,
                twd: twd,
                image: null // 圖片 Base64 字串
            };

            // 處理圖片上傳
            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                const reader = new FileReader();
                reader.onload = async (e) => {
                    // 壓縮圖片
                    entry.image = await compressImage(e.target.result);
                    
                    budgetEntries.unshift(entry);
                    saveToLS('budgetEntries', budgetEntries); // ** 儲存變更 **
                    renderPage();
                };
                reader.readAsDataURL(file);
            } else {
                budgetEntries.unshift(entry);
                saveToLS('budgetEntries', budgetEntries); // ** 儲存變更 **
                renderPage();
            }
        }

        window.updateExchangeRate = function(newRate) {
            const input = document.getElementById('exchange-rate-input');
            let rate = parseFloat(newRate || input.value);
            
            if (isNaN(rate) || rate <= 0) {
                alert("請輸入有效的匯率！");
                input.value = exchangeRate; // 還原舊值
                return;
            }

            exchangeRate = rate;
            saveToLS('exchangeRate', exchangeRate); // ** 儲存變更 **
            
            // 重新計算所有 TWD 總額
            budgetEntries.forEach(entry => {
                entry.twd = calculateTWD(entry.jpy);
            });

            saveToLS('budgetEntries', budgetEntries); // ** 儲存變更 **
            renderPage();
        }

            if (confirm("確定要刪除這筆記帳嗎？")) {

        }

                                    <i class="fas fa-edit text-sm"></i>
                                </button>
                                <button onclick="openAddFoodItemModal(${groupIndex})" class="text-gray-400 hover:text-var(--color-primary) p-1">
                                    <i class="fas fa-plus text-sm"></i>
                                </button>
                            </div>
                        </div>
                        
                        <ul class="list-disc list-inside ml-2 text-gray-700 text-base space-y-2">
                            ${group.items.map((item, itemIndex) => {
                                // ** 確保 Google Maps 連結使用 encodeURIComponent **
                                const query = `日本 ${group.city} ${group.area} ${item}`;
                                const mapLink = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}`;
                                
                                return `<li class="flex justify-between items-center group">
                                            <i class="fas fa-utensils text-gray-400 mr-1"></i> 
                                            <a href="${mapLink}" target="_blank" class="text-gray-800 hover:text-blue-600 font-medium">${item}</a>
                                            <div class="flex space-x-2 opacity-0 group-hover:opacity-100 transition-opacity">
                                                <button onclick="openEditFoodItemModal(${groupIndex}, ${itemIndex})" class="text-gray-400 hover:text-blue-600">
                                                    <i class="fas fa-pencil-alt text-sm"></i>
                                                </button>
                                                <button onclick="deleteFoodItem(${groupIndex}, ${itemIndex})" class="text-gray-400 hover:text-red-600">
                                                    <i class="fas fa-times text-sm"></i>
                                                </button>
                                            </div>
                                        </li>`;
                            }).join('')}
                        </ul>
                    </div>
                `;
                globalGroupIndex++;
            }
            return html;
        }

        function renderInfoPage() {
            return `
                <h2 class="text-2xl font-bold text-gray-800 mb-6">ℹ️ 應用程式資訊 (INFO)</h2>
                
                <div class="muji-card p-5 mb-6">
                    <h3 class="text-lg font-semibold text-gray-700 mb-3 border-b border-gray-100 pb-1">個人備忘錄 (Memo)</h3>
                    <textarea id="memo-content" rows="8" class="w-full p-2 border border-gray-300 rounded-lg focus:ring-var(--color-primary) focus:border-var(--color-primary) resize-none">${memoContent}</textarea>
                    <p class="text-xs text-gray-500 mt-2">此處內容會自動儲存。</p>
                </div>
                
                ${renderFoodRecommendations()}
                
                <div class="muji-card p-5 mb-6 border-2 border-dashed border-var(--color-accent) bg-var(--color-accent)/10">
                    <h3 class="text-lg font-bold text-gray-700 mb-3">新增美食區域</h3>
                    <button onclick="openAddFoodGroupModal()" class="muji-btn w-full py-2 font-semibold bg-var(--color-primary)/80 hover:bg-var(--color-primary)">
                        <i class="fas fa-layer-group mr-2"></i> 新增一個城市或地區群組
                    </button>
                </div>
                
                <div class="muji-card p-5 mb-6">
                    <h3 class="text-lg font-semibold text-gray-700 mb-3 border-b border-gray-100 pb-1">關於本指南</h3>
                    <p class="text-sm text-gray-700">版本：1.6 (修正 LocalStorage 穩定性問題)</p>
                    <p class="text-sm text-gray-700">設計目標：輕量化、視覺化、高互動性的單頁式旅遊行程管理。</p>
                    <p class="xs text-gray-500 mt-3">當前使用者 ID: ${userId}</p>
                </div>

                <div class="muji-card p-5 mb-6 border border-red-200 bg-red-50">
                    <h3 class="text-lg font-bold text-red-600 mb-3 border-b border-red-200 pb-1">💣 數據管理與重設</h3>
                    <p class="text-sm text-gray-600 mb-3">您的所有編輯（行程修改、記帳、清單等）都儲存在**瀏覽器的本地儲存**中。</p>
                    <button onclick="openResetConfirmModal()" class="muji-btn bg-red-500 hover:bg-red-600 w-full py-2 font-semibold">
                        <i class="fas fa-trash-alt mr-2"></i> 清除所有本地資料 (重設為初始狀態)
                    </button>
                    <p class="text-xs text-red-500 mt-2 text-center">**警告：此操作不可逆，將丟失所有個人化數據！**</p>
                </div>
            `;
        }
        
        // ====================================================================
        // 交通指南編輯 Modal 邏輯 (Transport Guide CRUD)
        // ====================================================================

        window.openEditTransportModal = function(index) {
            const item = tripInfo.editableTransportGuide[index];
            
            document.getElementById('transport-modal-index').value = index;
            document.getElementById('transport-modal-title').textContent = '編輯交通指南';
            document.getElementById('delete-transport-btn').style.display = 'block';
            
            document.getElementById('transport-modal-title-input').value = item.title || '';
            document.getElementById('transport-modal-icon-input').value = item.icon || 'fas fa-train';
            document.getElementById('transport-modal-text').value = item.text || '';
            document.getElementById('transport-modal-tip').value = item.tip || '';
            
            document.getElementById('edit-transport-modal').style.display = 'block';
        }

        window.openAddTransportModal = function() {
            document.getElementById('transport-modal-index').value = -1; // -1 表示新增
            document.getElementById('transport-modal-title').textContent = '新增交通指南項目';
            document.getElementById('delete-transport-btn').style.display = 'none';
            
            document.getElementById('transport-modal-title-input').value = '';
            document.getElementById('transport-modal-icon-input').value = 'fas fa-train';
            document.getElementById('transport-modal-text').value = '';
            document.getElementById('transport-modal-tip').value = '';
            
            document.getElementById('edit-transport-modal').style.display = 'block';
        }

        window.closeEditTransportModal = function() {
            document.getElementById('edit-transport-modal').style.display = 'none';
        }

        window.saveEditedTransportGuideItem = function() {
            const index = parseInt(document.getElementById('transport-modal-index').value);
            
            const newTitle = document.getElementById('transport-modal-title-input').value.trim();
            const newIcon = document.getElementById('transport-modal-icon-input').value.trim() || 'fas fa-circle-info';
            const newText = document.getElementById('transport-modal-text').value.trim();
            const newTip = document.getElementById('transport-modal-tip').value.trim();
            
            if (!newTitle || !newText) {
                alert("標題和內文不能為空！");
                return;
            }

            const newItem = {
                title: newTitle,
                icon: newIcon,
                text: newText,
                tip: newTip
            };

            if (index === -1) {
                // 新增模式
                tripInfo.editableTransportGuide.push(newItem);
            } else if (index >= 0 && index < tripInfo.editableTransportGuide.length) {
                // 編輯模式
                Object.assign(tripInfo.editableTransportGuide[index], newItem);
            } else {
                alert("儲存失敗：無效的索引。");
                return;
            }

            saveToLS('tripInfo', tripInfo); // ** 儲存變更 **
            closeEditTransportModal();
            renderPage(); // 重新渲染 GUIDE 頁面
        }

        window.deleteTransportGuideItem = function() {
            const index = parseInt(document.getElementById('transport-modal-index').value);

            if (confirm("確定要刪除這條交通指南嗎？")) {
                if (index >= 0 && index < tripInfo.editableTransportGuide.length) {
                    tripInfo.editableTransportGuide.splice(index, 1);
                    saveToLS('tripInfo', tripInfo); // ** 儲存變更 **
                    closeEditTransportModal();
                    renderPage();
                } else {
                    alert("刪除失敗：無法識別項目。");
                }
            }
        }
        
        // ====================================================================
        // NEW: 美食清單 CRUD 邏輯
        // ====================================================================
        
        // --- Food Item CRUD ---

        window.openEditFoodItemModal = function(groupIndex, itemIndex) {
            const itemText = tripInfo.foodRecommendations[groupIndex].items[itemIndex];

            document.getElementById('food-modal-mode').value = 'edit';
            document.getElementById('food-modal-group-index').value = groupIndex;
            document.getElementById('food-modal-item-index').value = itemIndex;
            document.getElementById('food-modal-title').textContent = '編輯美食項目';
            document.getElementById('food-modal-item-name').value = itemText;
            document.getElementById('delete-food-item-btn').style.display = 'block';

            document.getElementById('edit-food-item-modal').style.display = 'block';
        }

        window.openAddFoodItemModal = function(groupIndex) {
            document.getElementById('food-modal-mode').value = 'add';
            document.getElementById('food-modal-group-index').value = groupIndex;
            document.getElementById('food-modal-item-index').value = -1;
            document.getElementById('food-modal-title').textContent = '新增美食項目';
            document.getElementById('food-modal-item-name').value = '';
            document.getElementById('delete-food-item-btn').style.display = 'none';

            document.getElementById('edit-food-item-modal').style.display = 'block';
        }
        
        window.closeEditFoodItemModal = function() {
            document.getElementById('edit-food-item-modal').style.display = 'none';
        }

        window.saveEditedFoodItem = function() {
            const groupIndex = parseInt(document.getElementById('food-modal-group-index').value);
            const itemIndex = parseInt(document.getElementById('food-modal-item-index').value);
            const mode = document.getElementById('food-modal-mode').value;
            const newName = document.getElementById('food-modal-item-name').value.trim();

            if (!newName) {
                alert("美食名稱不能為空！");
                return;
            }

            if (mode === 'edit' && itemIndex >= 0) {
                // 編輯模式
                tripInfo.foodRecommendations[groupIndex].items[itemIndex] = newName;
            } else if (mode === 'add') {
                // 新增模式
                tripInfo.foodRecommendations[groupIndex].items.push(newName);
            } else {
                alert("儲存失敗：無效的操作。");
                return;
            }

            saveToLS('tripInfo', tripInfo); // ** 儲存變更 **
            closeEditFoodItemModal();
            renderPage();
        }

        window.deleteFoodItem = function(groupIndex, itemIndex) {
             // 處理兩種調用方式：直接傳入 index 或是從 Modal 中讀取
            if (typeof groupIndex !== 'number') {
                groupIndex = parseInt(document.getElementById('food-modal-group-index').value);
                itemIndex = parseInt(document.getElementById('food-modal-item-index').value);
            }

            if (confirm("確定要刪除這筆美食項目嗎？")) {
                 if (groupIndex >= 0 && itemIndex >= 0) {
                    tripInfo.foodRecommendations[groupIndex].items.splice(itemIndex, 1);
                    saveToLS('tripInfo', tripInfo); // ** 儲存變更 **
                    closeEditFoodItemModal();
                    renderPage();
                } else {
                    alert("刪除失敗：無法識別項目。");
                }
            }
        }

        // --- Food Group CRUD ---

        window.openEditFoodGroupModal = function(groupIndex) {
            const group = tripInfo.foodRecommendations[groupIndex];

            document.getElementById('food-group-modal-mode').value = 'edit';
            document.getElementById('food-group-modal-index').value = groupIndex;
            document.getElementById('food-group-modal-title').textContent = '編輯美食區域';
            document.getElementById('food-group-modal-city').value = group.city;
            document.getElementById('food-group-modal-area').value = group.area;
            document.getElementById('delete-food-group-btn').style.display = 'block';

            document.getElementById('edit-food-group-modal').style.display = 'block';
        }
        
        window.openAddFoodGroupModal = function() {
            document.getElementById('food-group-modal-mode').value = 'add';
            document.getElementById('food-group-modal-index').value = -1;
            document.getElementById('food-group-modal-title').textContent = '新增美食區域';
            document.getElementById('food-group-modal-city').value = '新增城市';
            document.getElementById('food-group-modal-area').value = '新增地區';
            document.getElementById('delete-food-group-btn').style.display = 'none';

            document.getElementById('edit-food-group-modal').style.display = 'block';
        }
        
        window.closeEditFoodGroupModal = function() {
            document.getElementById('edit-food-group-modal').style.display = 'none';
        }

        window.saveEditedFoodGroup = function() {
            const index = parseInt(document.getElementById('food-group-modal-index').value);
            const mode = document.getElementById('food-group-modal-mode').value;
            const newCity = document.getElementById('food-group-modal-city').value.trim();
            const newArea = document.getElementById('food-group-modal-area').value.trim();

            if (!newCity || !newArea) {
                alert("城市和地區名稱不能為空！");
                return;
            }

            if (mode === 'edit' && index >= 0) {
                // 編輯模式：保留原有的美食列表，更新城市/地區名稱
                tripInfo.foodRecommendations[index].city = newCity;
                tripInfo.foodRecommendations[index].area = newArea;

            } else if (mode === 'add') {
                // 新增模式：建立新的區域，帶空美食列表
                tripInfo.foodRecommendations.push({ city: newCity, area: newArea, items: [] });
            } else {
                alert("儲存失敗：無效的操作。");
                return;
            }

            saveToLS('tripInfo', tripInfo); // ** 儲存變更 **
            closeEditFoodGroupModal();
            renderPage();
        }

        window.deleteFoodGroup = function() {
            const index = parseInt(document.getElementById('food-group-modal-index').value);

            if (confirm("確定要刪除整個美食區域 (包含所有美食項目) 嗎？此操作不可逆！")) {
                 if (index >= 0) {
                    tripInfo.foodRecommendations.splice(index, 1);
                    saveToLS('tripInfo', tripInfo); // ** 儲存變更 **
                    closeEditFoodGroupModal();
                    renderPage();
                } else {
                    alert("刪除失敗：無法識別區域。");
                }
            }
        }


        // 點擊 Modal 外部關閉 (已更新包含所有 Modal)
        window.onclick = function(event) {
            const itemModal = document.getElementById('edit-item-modal');
            const dayModal = document.getElementById('edit-day-modal');
            const resetModal = document.getElementById('reset-confirm-modal');
            const transportModal = document.getElementById('edit-transport-modal');
            const foodItemModal = document.getElementById('edit-food-item-modal');
            const foodGroupModal = document.getElementById('edit-food-group-modal');


            if (event.target == itemModal) {
                closeEditItemModal();
            } else if (event.target == dayModal) {
                closeEditDayModal();
            } else if (event.target == resetModal) {
                closeResetConfirmModal();
            } else if (event.target == transportModal) {
                closeEditTransportModal();
            } else if (event.target == foodItemModal) {
                closeEditFoodItemModal();
            } else if (event.target == foodGroupModal) {
                closeEditFoodGroupModal();
            }
        }


        // ====================================================================
        // V. INITIALIZATION (初始化)
        // ====================================================================

        document.addEventListener('DOMContentLoaded', () => {
            // 設定使用者 ID 顯示
            document.getElementById('current-user-id').textContent = `使用者 ID: ${userId}`;
            
            // 綁定底部導航列事件
            document.querySelectorAll('.nav-item').forEach(button => {
                button.addEventListener('click', (e) => {
                    const newPage = e.currentTarget.dataset.page;
                    if (newPage) {
                        currentPage = newPage;
                        renderPage();
                    }
                });
            });

            // 初始渲染頁面 (此時所有數據已從 LocalStorage 載入)
            renderPage();
        });

    </script>
</body>
</html>
